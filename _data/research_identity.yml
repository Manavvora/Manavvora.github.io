research_threads:
  - title: Scalable Multi-Agent Learning
    summary: Communication and coordination methods that remain effective as agent populations grow.
    published: SCoUT · scalable communication and coordination
    current: Scalable sparse multi-agent diffusion
  - title: Resource-Aware Decision-Making
    summary: Planning and learning under limited budgets, capacity, and partial observability.
    published: IEEE Control Systems Letters · TMLR · IEEE RA-L
  - title: Information-Efficient Robotics
    summary: Robot control and planning that activate only the information and sensing needed for the task.
    published: ComTraQ-MPC · B-COD / just-enough sensing
    current: Heterogeneous-sensor multi-robot search and rescue
  - title: Strategic Coordination & Prediction
    summary: Planning and prediction when agents must resolve conflicts and act through uncertain occlusions.
    published: Predicted Reachability · strategic planning and control
    current: Nash-bargaining foundation models for conflict resolution · game-theoretic long-tail trajectory prediction

